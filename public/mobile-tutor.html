    <title>E-Tutor Avatar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: #1a1a1a;
            touch-action: none;
        }
        #canvas-container { 
            width: 100%; height: 100%; 
            position: absolute; 
            top: 0; left: 0;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }
        canvas { display: block; }
    </style>
</head>

        const DESKTOP_EXPRESSION_PROFILES = {

        const EXPRESSION_STRENGTH = {
            neutral: 1.0,
            normal: 1.0,
            smile: 1.0,
            happy: 1.0,
            laugh: 1.0,
            sad: 1.0,
            anger: 1.0,

            fear: 1.0,
            surprise: 1.0,
            disgust: 1.0,
            frown: 1.0,
            closed_smile: 1.0,
            funny_smile: 1.0,
            depress: 1.0
        };
        const SPEECH_EXPRESSION_INTENSITY_CAP = {
            neutral: 0.58,
            normal: 0.58,
            smile: 0.58,
            happy: 0.58,
            laugh: 0.54,
            closed_smile: 0.56,
            funny_smile: 0.54,
            sad: 0.42,
            sadness: 0.42,
            frown: 0.40,
            depress: 0.38,
            anger: 0.44,
            angry: 0.44,
            disgust: 0.42,
            fear: 0.46,
            surprise: 0.54
        };

        function expressionIntensityForSpeech(expressionName, requestedIntensity) {
            const normalized = String(expressionName || 'neutral').toLowerCase();
            const requested = Math.max(0, Number(requestedIntensity) || 0);
            const cap = SPEECH_EXPRESSION_INTENSITY_CAP[normalized] ?? 0.52;
            return Math.min(requested, cap);
        }

        const EMOTION_SPEECH_PROFILES = {
            neutral: { rate: 0.8, pitch: 1.0, volume: 1.0, expressionIntensity: 0.92 },
            normal: { rate: 0.8, pitch: 1.0, volume: 1.0, expressionIntensity: 0.92 },
            happy: { rate: 0.84, pitch: 1.08, volume: 1.0, expressionIntensity: 0.98 },
            smile: { rate: 0.82, pitch: 1.04, volume: 1.0, expressionIntensity: 0.96 },

            sadness: { rate: 0.7, pitch: 0.92, volume: 0.94, expressionIntensity: 0.96 },
            sad: { rate: 0.7, pitch: 0.92, volume: 0.94, expressionIntensity: 0.96 },
            anger: { rate: 0.77, pitch: 0.96, volume: 1.0, expressionIntensity: 1.0 },

            fear: { rate: 0.74, pitch: 1.06, volume: 0.96, expressionIntensity: 0.98 },
            surprise: { rate: 0.82, pitch: 1.08, volume: 1.0, expressionIntensity: 1.0 },
            disgust: { rate: 0.72, pitch: 0.95, volume: 0.96, expressionIntensity: 0.98 },
            frown: { rate: 0.72, pitch: 0.95, volume: 0.96, expressionIntensity: 0.94 },
            depress: { rate: 0.68, pitch: 0.9, volume: 0.92, expressionIntensity: 0.98 },
            closed_smile: { rate: 0.8, pitch: 1.02, volume: 1.0, expressionIntensity: 0.96 },
            funny_smile: { rate: 0.81, pitch: 1.04, volume: 1.0, expressionIntensity: 0.95 }
        };

        function resolveMorphIndex(dictionary, morphName) {
            if (!dictionary || !morphName) return -1;

            if (dictionary[morphName] !== undefined) {
                return dictionary[morphName];
            }

            const target = morphName.toLowerCase();
            const dictKeys = Object.keys(dictionary);

            const exactLower = dictKeys.find((key) => key.toLowerCase() === target);
            if (exactLower) {
                return dictionary[exactLower];
            }

            const containsLower = dictKeys.find((key) =>
                key.toLowerCase().includes(target) || target.includes(key.toLowerCase())
            );
            if (containsLower) {
                return dictionary[containsLower];
            }

            const aliases = MORPH_ALIASES[target] || [];
            for (const alias of aliases) {
                if (dictionary[alias] !== undefined) {
                    return dictionary[alias];
                }
                const aliasLower = dictKeys.find((key) => key.toLowerCase() === alias.toLowerCase());
                if (aliasLower) {
                    return dictionary[aliasLower];
                }
            }

            const fallbackName = aliases.find((alias) => FALLBACK_MORPH_ORDER.includes(alias)) || target;
            const fallbackIndex = FALLBACK_MORPH_ORDER.indexOf(fallbackName);
            if (fallbackIndex >= 0) {
                const hasNumericKeys = dictKeys.length > 0 && dictKeys.every((key) => /^\d+$/.test(String(key)));
                const hasNumericIndex = dictionary[String(fallbackIndex)] !== undefined || dictionary[fallbackIndex] !== undefined;
                if (hasNumericKeys || hasNumericIndex) {
                    return fallbackIndex;
                }
            }

            return -1;
        }
        function postFlutterSpeechComplete(requestId) {
            if (!requestId || !window.Flutter || typeof window.Flutter.postMessage !== 'function') {
                return;
            }
            window.Flutter.postMessage(`speech_complete::${requestId}`);
        }

        function postFlutterSpeechError(requestId, message) {
            if (!requestId || !window.Flutter || typeof window.Flutter.postMessage !== 'function') {
                return;
            }
            window.Flutter.postMessage(`speech_error::${requestId}::${encodeURIComponent(message || 'speech error')}`);
        }

        function postFlutterSpeechEngine(requestId, engine) {
            if (!window.Flutter || typeof window.Flutter.postMessage !== 'function') {
                return;
            }
            const safeEngine = encodeURIComponent(String(engine || 'unknown'));
            const safeRequestId = Number(requestId) || 0;
            window.Flutter.postMessage(`speech_engine::${safeRequestId}::${safeEngine}`);
        }

        async function getPollySpeechConfig() {
            // Reuse cached config if less than 7 minutes old
            const now = Date.now();
            if (pollySpeechConfigCache && pollySpeechConfigCache.enabled && (now - pollySpeechConfigFetchedAt) < 7 * 60 * 1000) {
                return pollySpeechConfigCache;
            }

            if (pollySpeechConfigPromise) {
                return pollySpeechConfigPromise;
            }

            pollySpeechConfigPromise = fetch('/tts/config', {
                method: 'GET',
                cache: 'no-store'
            }).then(async response => {
                if (!response.ok) {
                    throw new Error(`Polly speech config failed: ${response.status}`);
                }
                const config = await response.json();
                pollySpeechConfigCache = config;
                pollySpeechConfigFetchedAt = Date.now();
                return config;
            }).catch(error => {
                console.warn('Cloud TTS config unavailable:', error);
                return { enabled: false };
            }).finally(() => {
                pollySpeechConfigPromise = null;
            });

            return pollySpeechConfigPromise;
        }

        // Lazily create or resume a shared AudioContext at the device's native
        // sample rate. The Polly WAV is decoded once upfront when this optional path is enabled.
        // Using the device's native rate avoids real-time per-buffer resampling on Android.
        function getAudioContext() {
            if (!cloudAudioContext || cloudAudioContext.state === 'closed') {
                cloudAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (cloudAudioContext.state === 'suspended') {
                cloudAudioContext.resume();
            }
            return cloudAudioContext;
        }

        function clearCloudAudio() {
            // Stop any playing Web Audio source
            if (cloudAudioSource) {
                const sourceToStop = cloudAudioSource;
                const gainToStop = cloudGainNode;
                try {
                    sourceToStop.onended = null;
                    if (gainToStop && cloudAudioContext && cloudAudioContext.state !== 'closed') {
                        const now = cloudAudioContext.currentTime;
                        const currentGain = Math.max(0, Number(gainToStop.gain.value) || 0);
                        gainToStop.gain.cancelScheduledValues(now);
                        gainToStop.gain.setValueAtTime(currentGain, now);
                        gainToStop.gain.linearRampToValueAtTime(0, now + 0.028);
                        sourceToStop.stop(now + 0.03);
                        setTimeout(() => {
                            try { sourceToStop.disconnect(); } catch (_) {}
                        }, 40);
                    } else {
                        sourceToStop.stop();
                        sourceToStop.disconnect();
                    }
                } catch (_) {}
                cloudAudioSource = null;
            }
            if (cloudGainNode) {
                try { cloudGainNode.disconnect(); } catch (_) {}
                cloudGainNode = null;
            }
            // Legacy Audio element cleanup (for fallback path)
            if (cloudAudioElement) {
                const audioToStop = cloudAudioElement;
                try {
                    if (audioToStop._fadeOutTimer) {
                        clearTimeout(audioToStop._fadeOutTimer);
                        audioToStop._fadeOutTimer = null;
                    }
                    if (audioToStop._volumeRampFrame) {
                        cancelAnimationFrame(audioToStop._volumeRampFrame);
                        audioToStop._volumeRampFrame = null;
                    }
                    if (audioToStop._stopTimer) {
                        clearTimeout(audioToStop._stopTimer);
                        audioToStop._stopTimer = null;
                    }

                    if (!audioToStop.paused && audioToStop.currentTime > 0) {
                        const currentVolume = Math.max(0, Math.min(1, Number(audioToStop.volume) || 0));
                        audioToStop.volume = currentVolume;
                        rampAudioElementVolume(audioToStop, 0, 26);
                        audioToStop._stopTimer = setTimeout(() => {
                            try {
                                audioToStop.pause();
                                audioToStop.removeAttribute('src');
                                audioToStop.load();
                            } catch (_) {}
                        }, 32);
                    } else {
                        audioToStop.pause();
                        audioToStop.removeAttribute('src');
                        audioToStop.load();
                    }
                } catch (_) {}
                cloudAudioElement = null;
            }
            // Clear any pending viseme timers
            if (window._pollyVisemeTimers) {
                window._pollyVisemeTimers.forEach(t => clearTimeout(t));
                window._pollyVisemeTimers = [];
            }
        }

        function rampAudioElementVolume(audio, toVolume, durationMs) {
            if (!audio) return;
            const target = Math.max(0, Math.min(1, Number(toVolume) || 0));
            const duration = Math.max(1, Number(durationMs) || 1);
            const start = Math.max(0, Math.min(1, Number(audio.volume) || 0));

            if (audio._volumeRampFrame) {
                cancelAnimationFrame(audio._volumeRampFrame);
                audio._volumeRampFrame = null;
            }

            if (Math.abs(target - start) < 0.002) {
                audio.volume = target;
                return;
            }

            const startAt = performance.now();
            const tick = (now) => {
                const t = Math.max(0, Math.min(1, (now - startAt) / duration));
                // Smoothstep for gentle attack/release.
                const smooth = t * t * (3 - 2 * t);
                audio.volume = start + (target - start) * smooth;

                if (t < 1) {
                    audio._volumeRampFrame = requestAnimationFrame(tick);
                } else {
                    audio._volumeRampFrame = null;
                    audio.volume = target;
                }
            };

            audio._volumeRampFrame = requestAnimationFrame(tick);
        }

        function scheduleAudioFadeOut(audio) {
            if (!audio || !Number.isFinite(audio.duration) || audio.duration <= 0) {
                return;
            }

            if (audio._fadeOutTimer) {
                clearTimeout(audio._fadeOutTimer);
                audio._fadeOutTimer = null;
            }

            const totalMs = Math.round(audio.duration * 1000);
            const fadeLeadMs = Math.max(POLLY_FADE_OUT_MS + 12, 45);
            const delay = Math.max(0, totalMs - fadeLeadMs);
            audio._fadeOutTimer = setTimeout(() => {
                rampAudioElementVolume(audio, 0.0, POLLY_FADE_OUT_MS);
            }, delay);
        }

        async function waitForSpeechIdle(timeoutMs) {
            if (!isSpeaking) return;
            const timeout = Math.max(80, Number(timeoutMs) || 80);
            const start = Date.now();
            while (isSpeaking && (Date.now() - start) < timeout) {
                await new Promise((resolve) => setTimeout(resolve, 18));
            }
        }

        // Extra client-side conditioning pass to remove tiny transients that
        // can still appear as pops after decode on some Android devices.
        function conditionDecodedBuffer(audioBuffer) {
            if (!audioBuffer || !audioBuffer.length || !audioBuffer.numberOfChannels) {
                return;
            }

            const frameCount = audioBuffer.length;
            const fadeSamples = Math.max(1, Math.min(
                Math.floor(audioBuffer.sampleRate * 0.02),
                Math.floor(frameCount / 2),
            ));

            for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
                const data = audioBuffer.getChannelData(ch);
                if (!data || data.length < 8) continue;

                // Remove DC offset.
                let sum = 0;
                for (let i = 0; i < frameCount; i++) {
                    sum += data[i];
                }
                const mean = sum / frameCount;
                if (Math.abs(mean) > 1e-5) {
                    for (let i = 0; i < frameCount; i++) {
                        data[i] -= mean;
                    }
                }

                // Suppress isolated one-sample spikes.
                const clickThreshold = 0.18;
                for (let i = 1; i < frameCount - 1; i++) {
                    const prev = data[i - 1];
                    const curr = data[i];
                    const next = data[i + 1];
                    const jumpIn = curr - prev;
                    const jumpOut = next - curr;
                    const opposite = (jumpIn > 0 && jumpOut < 0) || (jumpIn < 0 && jumpOut > 0);
                    if (opposite && Math.abs(jumpIn) > clickThreshold && Math.abs(jumpOut) > clickThreshold) {
                        data[i] = (prev + next) * 0.5;
                    }
                }

                // Strong edge fade in/out.
                for (let i = 0; i < fadeSamples; i++) {
                    const g = i / fadeSamples;
                    data[i] *= g;
                    data[frameCount - 1 - i] *= g;
                }

                // Gentle soft limiting to avoid inter-sample clipping artifacts.
                const limit = 0.70;
                const tail = 1.0 - limit;
                for (let i = 0; i < frameCount; i++) {
                    const x = data[i];
                    const ax = Math.abs(x);
                    if (ax > limit) {
                        const over = (ax - limit) / tail;
                        const shaped = limit + tail * Math.tanh(over);
                        data[i] = Math.sign(x) * shaped;
                    }
                }
            }
        }

        // Polly viseme ID → avatar lip morph target
        // IDs 0-21 from AWS Polly TTS phonetic analysis
        const POLLY_VISEME_ID_TO_LIP_SHAPE = {
            0: null,           // Silence — relax to neutral (no lip shape active)
            1: 'eh',          // ae, ax, ah
            2: 'big_aah',     // aa
            3: 'oh',          // ao
            4: 'eh',          // ey, eh, uh
            5: 'r',           // er
            6: 'ee',          // y, iy, ih
            7: 'w',           // w, uw
            8: 'ooh_q',       // ow
            9: 'w',           // aw
            10: 'oh',         // oy
            11: 'eh',         // ay
            12: 'small_aah',  // h
            13: 'r',          // r
            14: 'n',          // l
            15: 'd_s_t',      // s, z
            16: 'ch_j_sh',    // sh, ch, jh, zh
            17: 'th',         // th, dh
            18: 'f_v',        // f, v
            19: 'd_s_t',      // d, t, n, th
            20: 'k',          // k, g, ng
            21: 'b_m_p',      // p, b, m
        };

        // Apply an Polly viseme by instantly writing to morph targets
        function applyPollyViseme(visemeId) {
            const shapeName = POLLY_VISEME_ID_TO_LIP_SHAPE[visemeId];
            
            if (!isReady || morphMeshes.length === 0) return;
            
            morphMeshes.forEach(mesh => {
                const dictionary = mesh.morphTargetDictionary;
                if (!dictionary) return;
                
                // Zero out all lip shapes
                LIP_SHAPES.forEach(shape => {
                    const idx = resolveMorphIndex(dictionary, shape);
                    if (idx >= 0) {
                        mesh.morphTargetInfluences[idx] = 0;
                        mesh.userData.currentInfluences[idx] = 0;
                        mesh.userData.targetInfluences[idx] = 0;
                    }
                });
                
                // Set the target shape (skip if null = silence/neutral)
                if (shapeName) {
                    const targetIdx = resolveMorphIndex(dictionary, shapeName);
                    if (targetIdx >= 0) {
                        const strength = LIP_SHAPE_STRENGTH[shapeName] || 1.0;
                        mesh.morphTargetInfluences[targetIdx] = strength;
                        mesh.userData.currentInfluences[targetIdx] = strength;
                        mesh.userData.targetInfluences[targetIdx] = strength;
                    }
                }
            });
        }

        async function trySpeakWithPolly(requestId, speechText, expression, speechProfile) {
            const config = await getPollySpeechConfig();
            if (!config.enabled) {
                return false;
            }

            // Compute SSML rate/pitch for the server
            const ratePercent = Math.max(-50, Math.min(5, Math.round(((speechProfile.rate / 0.85) - 1) * 100) - 10));
            const pitchPercent = Math.max(-15, Math.min(15, Math.round((speechProfile.pitch - 1.0) * 100)));

            try {
                // Avoid hard-cutting active audio where possible.
                await waitForSpeechIdle(420);
                clearCloudAudio();
                stopLipSync();

                const response = await fetch('/tts/synthesize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: speechText,
                        rate: ratePercent,
                        pitch: pitchPercent,
                    }),
                });

                if (!response.ok) {
                    console.warn('[Cloud TTS] Server returned', response.status);
                    return false;
                }

                const data = await response.json();
                const audioUrl = data.audioUrl;
                const visemes = data.visemes || [];
                const provider = data.provider || config.provider || 'cloud';

                if (!audioUrl) {
                    console.warn('[Cloud TTS] No audioUrl in response');
                    return false;
                }

                isSpeaking = true;
                setExpression(expression, expressionIntensityForSpeech(expression, speechProfile.expressionIntensity + 0.18), { persist: false, immediate: true });

                // ── Play via HTML Audio element with direct server URL ──
                // This is the ONLY audio path.  The Audio element feeds the WAV
                // directly into Android's native MediaPlayer (a separate OS
                // process), completely bypassing WebAudio which causes crackling.
                return await _playViaDirectUrl(requestId, audioUrl, visemes, speechProfile, provider);
            } catch (error) {
                console.warn('[Cloud TTS] fetch/play error:', error);
                return false;
            }
        }


        // ── Play audio from an in-memory Blob URL via HTML Audio ──
        // Keeps decoding in the platform media pipeline while avoiding
        // network-stream jitter during playback.
        async function _playViaBufferedAudioElement(requestId, audioBytes, visemes, speechProfile, mimeType) {
            const audioBlob = new Blob([audioBytes], { type: mimeType || 'audio/wav' });
            const blobUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio();
            audio.preload = 'auto';
            const targetVolume = Math.min(
                POLLY_TARGET_VOLUME,
                Math.max(0, Number(speechProfile?.volume || 1.0))
            );
            audio.volume = 0.0;
            cloudAudioElement = audio;

            return await new Promise((resolve) => {
                audio.onplay = function() {
                    postFlutterSpeechEngine(requestId, 'polly_audio_element_buffered');
                    console.log('[Polly TTS] ▶ Playing via buffered audio element (' +
                        (audio.duration ? audio.duration.toFixed(2) + 's' : '?') + ')');
                    rampAudioElementVolume(audio, targetVolume, POLLY_FADE_IN_MS);
                    scheduleAudioFadeOut(audio);
                    _startPollyLipSync(visemes, audio);
                };

                audio.onended = function() {
                    if (audio._fadeOutTimer) {
                        clearTimeout(audio._fadeOutTimer);
                        audio._fadeOutTimer = null;
                    }
                    if (audio._volumeRampFrame) {
                        cancelAnimationFrame(audio._volumeRampFrame);
                        audio._volumeRampFrame = null;
                    }
                    if (audio._stopTimer) {
                        clearTimeout(audio._stopTimer);
                        audio._stopTimer = null;
                    }
                    URL.revokeObjectURL(blobUrl);
                    _finishPollyPlayback(null, requestId);
                    cloudAudioElement = null;
                    resolve(true);
                };

                audio.onerror = function(event) {
                    console.error('[Polly TTS] Buffered audio element error:', event);
                    if (audio._fadeOutTimer) {
                        clearTimeout(audio._fadeOutTimer);
                        audio._fadeOutTimer = null;
                    }
                    if (audio._volumeRampFrame) {
                        cancelAnimationFrame(audio._volumeRampFrame);
                        audio._volumeRampFrame = null;
                    }
                    if (audio._stopTimer) {
                        clearTimeout(audio._stopTimer);
                        audio._stopTimer = null;
                    }
                    URL.revokeObjectURL(blobUrl);
                    isSpeaking = false;
                    cloudAudioElement = null;
                    resolve(false);
                };

                audio.onloadedmetadata = function() {
                    scheduleAudioFadeOut(audio);
                };

                audio.oncanplaythrough = function() {
                    audio.oncanplaythrough = null;
                    audio.play().catch(function(err) {
                        console.warn('[Polly TTS] Buffered audio play() rejected:', err);
                        URL.revokeObjectURL(blobUrl);
                        isSpeaking = false;
                        cloudAudioElement = null;
                        resolve(false);
                    });
                };

                audio.src = blobUrl;
            });
        }

        async function _playViaWebAudioBuffer(requestId, audioBytes, visemes, speechProfile) {
            try {
                const ctx = getAudioContext();
                const decoded = await ctx.decodeAudioData(audioBytes.slice(0));
                conditionDecodedBuffer(decoded);
                const source = ctx.createBufferSource();
                const highpass = ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 56;
                highpass.Q.value = 0.7;

                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.value = -20;
                compressor.knee.value = 14;
                compressor.ratio.value = 6;
                compressor.attack.value = 0.003;
                compressor.release.value = 0.18;

                const gainNode = ctx.createGain();
                const targetVolume = Math.min(
                    POLLY_TARGET_VOLUME,
                    Math.max(0, Number(speechProfile?.volume || 1.0)),
                );
                const duration = decoded.duration;
                const now = ctx.currentTime;
                const fadeInSec = Math.max(0.010, POLLY_FADE_IN_MS / 1000);
                const fadeOutSec = Math.max(0.012, POLLY_FADE_OUT_MS / 1000);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(targetVolume, now + fadeInSec);
                if (duration > fadeInSec + fadeOutSec) {
                    gainNode.gain.setValueAtTime(targetVolume, now + duration - fadeOutSec);
                }
                gainNode.gain.linearRampToValueAtTime(0, now + duration);

                source.buffer = decoded;
                source.connect(highpass);
                highpass.connect(compressor);
                compressor.connect(gainNode);
                gainNode.connect(ctx.destination);

                cloudAudioSource = source;
                cloudGainNode = gainNode;

                return await new Promise((resolve) => {
                    _startPollyLipSync(visemes);

                    source.onended = function() {
                        console.log('[Polly TTS] WebAudio playback complete');
                        _finishPollyPlayback(gainNode, requestId);
                        resolve(true);
                    };

                    try {
                        source.start(0);
                        postFlutterSpeechEngine(requestId, 'polly_webaudio_buffered');
                        console.log('[Polly TTS] ▶ Playing via buffered WebAudio (' + duration.toFixed(2) + 's)');
                    } catch (playError) {
                        console.warn('[Polly TTS] buffered WebAudio start failed:', playError);
                        isSpeaking = false;
                        cloudAudioSource = null;
                        try { gainNode.disconnect(); } catch (_) {}
                        cloudGainNode = null;
                        resolve(false);
                    }
                });
            } catch (error) {
                console.warn('[Polly TTS] buffered WebAudio error:', error);
                return false;
            }
        }

        // ── Play audio directly from a server URL ──
        // This is the cleanest audio path on Android: the browser's native
        // HTTP streaming feeds directly into Android's MediaPlayer process.
        // No JavaScript audio processing, no Blob creation, no base64 decoding.
        async function _playViaDirectUrl(requestId, audioUrl, visemes, speechProfile, provider) {
            const audio = new Audio();
            audio.preload = 'auto';
            const targetVolume = Math.min(
                POLLY_TARGET_VOLUME,
                Math.max(0, Number(speechProfile?.volume || 1.0))
            );
            audio.volume = targetVolume;
            cloudAudioElement = audio;

            return await new Promise((resolve) => {
                audio.onplay = function() {
                    const engineId = 'polly_audio_element_stream';
                    const providerLabel = 'Polly TTS';
                    postFlutterSpeechEngine(requestId, engineId);
                    console.log('[' + providerLabel + '] Playing (' +
                        (audio.duration ? audio.duration.toFixed(2) + 's' : '?') +
                        ') from ' + audioUrl);
                    _startPollyLipSync(visemes, audio);
                };

                audio.onended = function() {
                    console.log('[Polly TTS] Playback complete');
                    _finishPollyPlayback(null, requestId);
                    cloudAudioElement = null;
                    resolve(true);
                };

                audio.onerror = function(event) {
                    console.error('[Polly TTS] Audio error:', event);
                    isSpeaking = false;
                    cloudAudioElement = null;
                    resolve(false);
                };

                // Wait for the browser to confirm enough data is buffered
                // for uninterrupted playback before starting.
                audio.oncanplaythrough = function() {
                    audio.oncanplaythrough = null;
                    audio.play().catch(function(err) {
                        console.warn('[Polly TTS] play() rejected:', err);
                        isSpeaking = false;
                        cloudAudioElement = null;
                        resolve(false);
                    });
                };

                // Set src AFTER all event handlers are attached.
                // The browser will fetch the WAV from the server URL using its
                // native HTTP stack and decode it in the MediaPlayer process.
                audio.src = audioUrl;
            });
        }

        // ── Shared: start Polly viseme lip-sync animation ──
        let _pollyVisemes = [];
        let _pollyVisemeIndex = -1;
        let _pollyExternalElapsedMs = 0;
        let _pollyExternalElapsedAt = 0;
        const POLLY_VISEME_LEAD_MS = 35;
        const POLLY_EXTERNAL_CLOCK_STALE_MS = 180;

        function _startPollyLipSync(visemes, audioElement) {
            lipSyncActive = true;
            if (lipSyncFrameId) {
                cancelAnimationFrame(lipSyncFrameId);
                lipSyncFrameId = null;
            }
            
            _pollyVisemes = Array.isArray(visemes) ? visemes : [];
            _pollyVisemeIndex = -1;
            lipSyncStartTime = Date.now();
            lastLipAnimTime = Date.now();
            lipSyncAudioElement = audioElement || null;
            _pollyExternalElapsedMs = 0;
            _pollyExternalElapsedAt = 0;
            
            lipAnimator.reset();
            lipAnimator.statDur = 0.001;
            
            animatePollyLipSync();
        }

        function getPollyVisemeElapsedMs() {
            const audio = lipSyncAudioElement;
            if (audio && !audio.paused && Number.isFinite(audio.currentTime)) {
                return Math.max(0, Math.round((audio.currentTime * 1000) + POLLY_VISEME_LEAD_MS));
            }
            if (_pollyExternalElapsedAt > 0 && performance.now() - _pollyExternalElapsedAt < POLLY_EXTERNAL_CLOCK_STALE_MS) {
                return Math.max(0, Math.round(_pollyExternalElapsedMs + POLLY_VISEME_LEAD_MS));
            }
            return Math.max(0, Date.now() - lipSyncStartTime);
        }

        function animatePollyLipSync() {
            if (!lipSyncActive) return;

            const now = Date.now();
            const dt = Math.min((now - lastLipAnimTime) / 1000, 0.05);
            lastLipAnimTime = now;

            const elapsed = getPollyVisemeElapsedMs();

            let nextIndex = _pollyVisemeIndex + 1;
            while (nextIndex < _pollyVisemes.length && _pollyVisemes[nextIndex].offset <= elapsed) {
                nextIndex++;
            }
            
            const currentVisemeIndex = nextIndex - 1;
            if (currentVisemeIndex >= 0 && currentVisemeIndex !== _pollyVisemeIndex) {
                _pollyVisemeIndex = currentVisemeIndex;
                const viseme = _pollyVisemes[_pollyVisemeIndex];
                const shapeName = POLLY_VISEME_ID_TO_LIP_SHAPE[viseme.id];
                
                // Estimate duration until next viseme (or default to 100ms)
                const nextOffset = (_pollyVisemeIndex + 1) < _pollyVisemes.length 
                    ? _pollyVisemes[_pollyVisemeIndex + 1].offset 
                    : elapsed + 100;
                
                const durationMs = Math.max(Math.min(nextOffset - viseme.offset, 180), 55);
                lipAnimator.transDur = durationMs / 1000;
                
                lipAnimator.setPhonemeTarget(shapeName || null);
            }

            if (_pollyVisemeIndex >= _pollyVisemes.length - 1 && elapsed > (_pollyVisemes.length > 0 ? _pollyVisemes[_pollyVisemes.length - 1].offset + 150 : 150)) {
                // Done
                lipAnimator.setPhonemeTarget(null);
                const lipValues = lipAnimator.getValues(dt);
                applyLipValues(lipValues);
                
                let maxVal = 0;
                LIP_SHAPES.forEach(s => { maxVal = Math.max(maxVal, Math.abs(lipValues[s] || 0)); });
                if (maxVal < 0.01) {
                    stopLipSync();
                    return;
                }
            }

            const lipValues = lipAnimator.getValues(dt);
            applyLipValues(lipValues);

            lipSyncFrameId = requestAnimationFrame(animatePollyLipSync);
        }
        // Shared: finish Polly playback and clean up
        function _finishPollyPlayback(gainNode, requestId) {
            isSpeaking = false;
            cloudAudioSource = null;
            cloudGainNode = null;
            lipAnimator.setPhonemeTarget(null);
            setTimeout(function() {
                lipSyncActive = false;
                if (lipSyncFrameId) {
                    cancelAnimationFrame(lipSyncFrameId);
                    lipSyncFrameId = null;
                }
                lipAnimator.reset();
                resetAllLipTargets();
                clearCloudAudio();
                setExpression(restingExpressionName, 1.0, { persist: false });
            }, 200);
            if (gainNode) {
                try { gainNode.disconnect(); } catch (_) {}
            }
            postFlutterSpeechComplete(requestId);
        }

        async function speakRequest(requestId, request) {
            const speechText = request.text;
            if (!speechText) {
                postFlutterSpeechError(requestId, 'No speech text provided');
                return false;
            }

            const expression = EXPRESSIONS[request.emotion] ? request.emotion : 'neutral';
            const speechProfile = request.speechProfile;

            // Priority 1: AWS Polly TTS (best quality, viseme lip-sync).
            // Retry for transient network/decode/audio-start hiccups.
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const pollySuccess = await trySpeakWithPolly(
                        requestId,
                        speechText,
                        expression,
                        speechProfile,
                    );
                    if (pollySuccess) {
                        return true;
                    }
                    console.warn(`[Polly TTS] Attempt ${attempt + 1} returned false`);
                } catch (pollyError) {
                    console.warn(`[Polly TTS] Attempt ${attempt + 1} threw`, pollyError);
                }

                if (attempt < 2) {
                    await new Promise((resolve) => setTimeout(resolve, 220 + (attempt * 180)));
                }
            }

            // Priority 2: Browser SpeechSynthesis fallback.
            // Browser speech is the only client fallback in this Polly-focused build.
            if (window.speechSynthesis && ALLOW_BROWSER_SPEECH_FALLBACK) {
                if (currentUtterance) {
                    window.speechSynthesis.cancel();
                    currentUtterance = null;
                    isSpeaking = false;
                }

                setExpression(expression, expressionIntensityForSpeech(expression, speechProfile.expressionIntensity + 0.08), { persist: false });

                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.rate = speechProfile.rate;
                utterance.pitch = speechProfile.pitch;
                utterance.volume = speechProfile.volume;

                const speechDuration = (speechText.length / 15) / utterance.rate;

                utterance.onstart = function() {
                    isSpeaking = true;
                    setExpression(expression, expressionIntensityForSpeech(expression, speechProfile.expressionIntensity + 0.08), { persist: false });
                    startLipSync(speechText, speechDuration, request.phonemes);
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    currentUtterance = null;
                    stopLipSync();
                    setTimeout(function() {
                        setExpression(restingExpressionName, 1.0, { persist: false });
                    }, 180);
                    postFlutterSpeechComplete(requestId);
                };

                utterance.onerror = function(event) {
                    console.error('Speech synthesis error:', event.error || event);
                    isSpeaking = false;
                    currentUtterance = null;
                    postFlutterSpeechError(requestId, String(event.error || 'Browser speech synthesis error'));
                };

                currentUtterance = utterance;
                postFlutterSpeechEngine(requestId, 'browser_speech');
                window.speechSynthesis.speak(utterance);

                setTimeout(() => {
                    if (!lipSyncActive && currentUtterance === utterance) {
                        console.log('Forcing lip sync start (onstart delayed)');
                        startLipSync(speechText, speechDuration, request.phonemes);
                    }
                }, 100);

                return true;
            }

            if (window.speechSynthesis && !ALLOW_BROWSER_SPEECH_FALLBACK) {
                console.warn('[FALLBACK] browser speech disabled for quality; append ?browser_fallback=1 to enable');
            }

            postFlutterSpeechError(requestId, 'No speech engine available');
            return false;
        }

        function normalizeModeId(modeId) {
            if (modeId === null || modeId === undefined) {
                return null;
            }

            const parsed = Number(modeId);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function computeSentimentSignal(metadata, text) {
            if (metadata && metadata.sentiment) {
                const sentiment = metadata.sentiment;
                const pos = Number(sentiment.pos || 0);
                const neu = Number(sentiment.neu || 0);
                const neg = Number(sentiment.neg || 0);

                if (pos >= neu && pos >= neg) return 1;
                if (neg >= neu && neg >= pos) return -1;
                return 0;
            }

            const normalized = (text || '').toLowerCase();
            const positiveHits = [
                'great', 'excellent', 'awesome', 'nice', 'well done', 'correct',
                'good job', 'amazing', 'perfect', 'fantastic'
            ].reduce((count, token) => count + (normalized.includes(token) ? 1 : 0), 0);
            const negativeHits = [
                'incorrect', 'wrong', 'mistake', 'careful', 'warning', 'sorry',
                'try again', 'not quite', 'error'
            ].reduce((count, token) => count + (normalized.includes(token) ? 1 : 0), 0);

            if (positiveHits > negativeHits) return 1;
            if (negativeHits > positiveHits) return -1;
            return 0;
        }

        function inferEmotionFromDesktopMode(modeId, sentimentSignal) {
            switch (modeId) {
                case 0:
                    return sentimentSignal === -1 ? 'disgust' : sentimentSignal === 0 ? 'fear' : 'happy';
                case 1:
                    return sentimentSignal === -1 ? 'anger' : sentimentSignal === 0 ? 'sad' : 'happy';
                case 2:
                    return sentimentSignal === -1 ? 'anger' : 'surprise';
                case 3:
                    return sentimentSignal === -1 ? 'fear' : sentimentSignal === 0 ? 'sad' : 'surprise';
                default:
                    return null;
            }
        }

        function getSpeechProfile(emotionName) {
            return EMOTION_SPEECH_PROFILES[emotionName] || EMOTION_SPEECH_PROFILES.neutral;
        }

        function parseSpeechRequest(textInput, optionsOrEmotion) {
            const options = optionsOrEmotion && typeof optionsOrEmotion === 'object' && !Array.isArray(optionsOrEmotion)
                ? optionsOrEmotion
                : {};
            const text = typeof textInput === 'string'
                ? textInput
                : typeof options.text === 'string'
                    ? options.text
                    : '';
            const explicitEmotion = typeof optionsOrEmotion === 'string'
                ? optionsOrEmotion
                : typeof options.emotion === 'string'
                    ? options.emotion
                    : null;
            const modeId = normalizeModeId(options.modeId);
            const sentimentSignal = computeSentimentSignal(options, text);
            const fuzzyEmotion = modeId === null ? null : inferEmotionFromDesktopMode(modeId, sentimentSignal);
            const inferredEmotion = explicitEmotion || fuzzyEmotion || inferEmotionFromText(text, options) || 'neutral';
            const phonemes = Array.isArray(options.phonemes) ? options.phonemes : null;
            const speechProfile = getSpeechProfile(String(inferredEmotion).toLowerCase());

            return {
                text: text.trim(),
                emotion: String(inferredEmotion).toLowerCase(),
                phonemes,
                speechProfile,
                modeId,
                sentimentSignal
            };
        }

        function detectDeviceProfile() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const memory = navigator.deviceMemory || 4;
            const cores = navigator.hardwareConcurrency || 4;
            const connectionType = navigator.connection?.effectiveType || '4g';
            const prefersReducedMotion = !!window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const slowConnection = ['slow-2g', '2g', '3g'].includes(connectionType);
            const isLowEnd = isMobile && (memory <= 4 || cores <= 4 || slowConnection || prefersReducedMotion);

            return {
                isMobile,
                isLowEnd,
                memory,
                cores,
                connectionType,
                prefersReducedMotion,
                // Aggressively restrict pixel ratio on mobile to save fragment shader GPU/CPU time,
                // which prevents the render thread from starving the Android audio thread.
                pixelRatio: isLowEnd ? 0.8 : isMobile ? 1.0 : Math.min(window.devicePixelRatio || 1, 2),
                targetFPS: isLowEnd ? 30 : isMobile ? 45 : 60,
                animationSpeed: isLowEnd ? 6 : isMobile ? 8 : 12,
                antialias: !isLowEnd && !isMobile,
                ambientLight: isLowEnd ? 0.54 : 0.6,
                keyLight: isLowEnd ? 0.72 : 0.8,
                fillLight: isLowEnd ? 0.22 : 0.3,
                rimLight: isLowEnd ? 0.32 : 0.5
            };
        }

        function ensureMorphBuffers(mesh) {
            if (!mesh || !mesh.morphTargetInfluences) {
                return;
            }

            const influenceCount = mesh.morphTargetInfluences.length;
            if (!mesh.userData.currentInfluences || mesh.userData.currentInfluences.length !== influenceCount) {
                mesh.userData.currentInfluences = Array.from(mesh.morphTargetInfluences, value => value || 0);
            }
            if (!mesh.userData.targetInfluences || mesh.userData.targetInfluences.length !== influenceCount) {
                mesh.userData.targetInfluences = Array.from(mesh.userData.currentInfluences);
            }
        }

        function getLipIndices(dictionary) {
            const lipIndices = new Set();
            LIP_SHAPES.forEach(shape => {
                const idx = resolveMorphIndex(dictionary, shape);
                if (idx >= 0) {
                    lipIndices.add(idx);
                }
            });
            const lipCloseIdx = resolveMorphIndex(dictionary, 'lip_close');
            if (lipCloseIdx >= 0) lipIndices.add(lipCloseIdx);
            return lipIndices;
        }

        function getExpressionProfile(expressionName, intensity) {
            const normalizedExpression = (expressionName || 'neutral').toLowerCase();
            const baseProfile = DESKTOP_EXPRESSION_PROFILES[normalizedExpression] || { [normalizedExpression]: 1.0 };
            const strength = EXPRESSION_STRENGTH[normalizedExpression] || 1.0;
            const scaledProfile = {};

            Object.entries(baseProfile).forEach(([name, value]) => {
                // Hard cap at 1.0 — morph target influences above 1.0 push
                // vertices beyond their designed positions, causing the uncanny
                // stretched-face distortion visible in the 'laugh' morph.
                scaledProfile[name] = Math.max(0, Math.min(1.0, value * intensity * strength));
            });

            return scaledProfile;
        }

        function resetExpressionTargets(mesh, lipIndices) {
            ensureMorphBuffers(mesh);
            mesh.userData.targetInfluences.forEach((_, index) => {
                if (!lipIndices.has(index)) {
                    mesh.userData.targetInfluences[index] = 0;
                }
            });
        }

        function setRestingLipTargets(mesh) {
            ensureMorphBuffers(mesh);
            const dictionary = mesh.morphTargetDictionary;
            if (!dictionary) {
                return;
            }

            LIP_SHAPES.forEach(shape => {
                const idx = resolveMorphIndex(dictionary, shape);
                if (idx >= 0) {
                    mesh.userData.targetInfluences[idx] = 0;
                }
            });

            // Also zero lip_close so it doesn't pull upper lip into lower lip
            const lipCloseIdx = resolveMorphIndex(dictionary, 'lip_close');
            if (lipCloseIdx >= 0) {
                mesh.userData.targetInfluences[lipCloseIdx] = 0;
            }
        }

        function setRestingLipPose(forceImmediate) {
            morphMeshes.forEach(mesh => {
                ensureMorphBuffers(mesh);
                setRestingLipTargets(mesh);

                if (forceImmediate) {
                    mesh.userData.currentInfluences = Array.from(mesh.userData.targetInfluences);
                    mesh.userData.currentInfluences.forEach((value, index) => {
                        mesh.morphTargetInfluences[index] = value;
                    });
                }
            });
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            deviceProfile = detectDeviceProfile();
            // AWS Polly TTS is preferred for high-quality audio;
            // native flutter_tts is used only as offline/error fallback.
            preferNativeTts = false;
            console.log('Device profile:', JSON.stringify(deviceProfile));

            // Scene - match desktop renderer visuals
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Camera - desktop-like framing
            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(0, 50, 400);
            camera.lookAt(0, 0, 0);

            // Renderer: logarithmic depth buffer is disabled because it forces
            // gl_FragDepth modifications in shaders, breaking early-Z rejection
            // and massively reducing performance on tile-based mobile GPUs (and emulators).
            renderer = new THREE.WebGLRenderer({
                antialias: deviceProfile.antialias,
                alpha: false,
                stencil: false,
                powerPreference: 'high-performance',
                precision: 'mediump', // 'highp' is overkill for the avatar and hurts emulator perf
                logarithmicDepthBuffer: false
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(deviceProfile.pixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.setClearColor(0x1a1a1a, 1);
            renderer.sortObjects = true;
            container.appendChild(renderer.domElement);

            // Lighting - match desktop warm natural look
            const ambientLight = new THREE.AmbientLight(0xfff5e6, deviceProfile.ambientLight);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xfff9f0, deviceProfile.keyLight);
            keyLight.position.set(0, 100, 300);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xe6f0ff, deviceProfile.fillLight);
            fillLight.position.set(-150, 50, 150);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, deviceProfile.rimLight);
            rimLight.position.set(100, 80, -150);
            scene.add(rimLight);

            // Load avatar
            loadAvatar();

            // Handle resize
            window.addEventListener('resize', onResize);

            // Start render loop
            animate();

            // ── Audio pipeline warm-up ──
            // On Android, the first audio playback through AudioContext causes
            // On Android, the first Audio element playback can cause a small
            // pop while the OS activates the MediaPlayer audio session.
            // We prime the pipeline by loading a tiny silent WAV.
            function warmUpAudioPipeline() {
                try {
                    // Create a minimal valid WAV (44 bytes header + 4 bytes silence)
                    // at 48kHz 16-bit mono — matches our optimized Polly TTS output.
                    const wavHeader = new Uint8Array([
                        0x52,0x49,0x46,0x46, // "RIFF"
                        0x2A,0x00,0x00,0x00, // file size - 8 = 42
                        0x57,0x41,0x56,0x45, // "WAVE"
                        0x66,0x6D,0x74,0x20, // "fmt "
                        0x10,0x00,0x00,0x00, // chunk size = 16
                        0x01,0x00,            // PCM format
                        0x01,0x00,            // 1 channel
                        0x80,0xBB,0x00,0x00, // 48000 Hz
                        0x00,0x77,0x01,0x00, // byte rate = 96000
                        0x02,0x00,            // block align = 2
                        0x10,0x00,            // 16 bits per sample
                        0x64,0x61,0x74,0x61, // "data"
                        0x04,0x00,0x00,0x00, // data size = 4 bytes (2 samples)
                        0x00,0x00,0x00,0x00  // 2 silent samples
                    ]);
                    const blob = new Blob([wavHeader], { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = new Audio();
                    a.volume = 0;
                    a.src = url;
                    a.play().then(function() {
                        a.onended = function() {
                            URL.revokeObjectURL(url);
                            console.log('[Audio] MediaPlayer warm-up complete');
                        };
                    }).catch(function(e) {
                        URL.revokeObjectURL(url);
                        console.warn('[Audio] MediaPlayer warm-up skipped:', e);
                    });
                } catch (e) {
                    console.warn('[Audio] Warm-up failed:', e);
                }
            }
            window.warmUpAudioPipeline = warmUpAudioPipeline;

            // Warm up immediately (works on Android WebView where autoplay
            // is allowed via setMediaPlaybackRequiresUserGesture(false))
            warmUpAudioPipeline();

            // Also warm up on the first user touch (required by Chrome autoplay
            // policy on iOS WebKit where AudioContext starts suspended)
            document.addEventListener('touchstart', function _warmOnTouch() {
                document.removeEventListener('touchstart', _warmOnTouch);
                warmUpAudioPipeline();
            }, { once: true, passive: true });
        }

        // ============================================
        // AVATAR LOADING
        // ============================================
        function loadAvatar() {
            const loader = new THREE.GLTFLoader();
            
            // Get gender from URL parameter (default to female)
            const urlParams = new URLSearchParams(window.location.search);
            const gender = urlParams.get('gender') || 'female';
            const modelUrl = gender === 'male' ? 'models/male_avatar.glb' : 'models/avatar_female.glb';
            
            console.log('Loading avatar:', modelUrl, 'gender:', gender);

            loader.load(
                modelUrl,
                function(gltf) {
                    avatar = gltf.scene;
                    
                    // =====================================================
                    // MATCH DESKTOP: No scaling, just center it
                    // =====================================================
                    avatar.scale.set(1.0, 1.0, 1.0);
                    
                    const box = new THREE.Box3().setFromObject(avatar);
                    const center = box.getCenter(new THREE.Vector3());
                    avatar.position.set(-center.x, -center.y - 20, 0); // -20 pushes down to center in the box
                    
                    console.log('Avatar centered at:', -center.x, -center.y - 20, 0);
                    
                    // Process all meshes
                    avatar.traverse(function(node) {
                        if (node.isMesh) {
                            if (node.material) {
                                const materials = Array.isArray(node.material) ? node.material : [node.material];
                                materials.forEach((mat, idx) => {
                                    // =====================================================
                                    // FIX BLACK GASH & MATCH DESKTOP MATERIALS
                                    // =====================================================
                                    mat.flatShading = false;
                                    mat.side = THREE.FrontSide; // Render front only like desktop
                                    mat.transparent = true;
                                    mat.alphaTest = 0.5;  // CRITICAL: Discard low-alpha pixels (fixes gash!)
                                    mat.depthTest = true;
                                    mat.depthWrite = true;
                                    mat.morphTargets = true;
                                    mat.morphNormals = true;
                                    
                                    const isHair = node.name.toLowerCase().includes('hair') || 
                                                   node.name.toLowerCase().includes('texture1');
                                                   
                                    if (mat.color) {
                                        const hsl = {};
                                        mat.color.getHSL(hsl);
                                        
                                        if (isHair) {
                                            const newS = Math.min(hsl.s * 3.0, 1.0);
                                            const newL = hsl.l * 1.5;
                                            mat.color.setHSL(hsl.h, newS, newL);
                                            
                                            if (mat.emissive) {
                                                mat.emissive.setHSL(hsl.h, newS * 0.7, newL * 0.4);
                                                mat.emissiveIntensity = 0.5;
                                            }
                                        } else {
                                            const newS = Math.min(hsl.s * 1.2, 1.0);
                                            const newL = Math.min(hsl.l * 1.1, 0.8);
                                            mat.color.setHSL(hsl.h, newS, newL);
                                        }
                                    }
                                    
                                    if (mat.metalness !== undefined) mat.metalness = 0.0;
                                    if (mat.roughness !== undefined) mat.roughness = isHair ? 0.6 : 0.95;
                                    if (!isHair && mat.thickness !== undefined) mat.thickness = 0.5;
                                    
                                    // DEBUG: If no texture, apply a visible color based on material name
                                    if (!mat.map) {
                                        const name = (mat.name || '').toLowerCase();
                                        if (name.includes('skin') || name.includes('head') || name.includes('body') || name.includes('arm')) {
                                            mat.color = new THREE.Color(0.9, 0.75, 0.65); // Skin tone
                                        } else if (name.includes('hair') || name.includes('scalp') || name.includes('beard') || name.includes('stubble') || name.includes('bushy') || name.includes('mustache')) {
                                            mat.color = new THREE.Color(0.15, 0.1, 0.08); // Dark brown hair
                                        } else if (name.includes('eye') && !name.includes('lash') && !name.includes('occlusion')) {
                                            mat.color = new THREE.Color(1, 1, 1); // White of eye
                                        } else if (name.includes('cornea')) {
                                            mat.color = new THREE.Color(0.4, 0.25, 0.15); // Brown iris
                                            mat.transparent = true;
                                            mat.opacity = 0.9;
                                        } else if (name.includes('teeth') || name.includes('tongue')) {
                                            mat.color = new THREE.Color(0.95, 0.92, 0.88); // Teeth white
                                        } else if (name.includes('lash') || name.includes('brow')) {
                                            mat.color = new THREE.Color(0.1, 0.08, 0.06); // Dark lashes
                                        } else if (name.includes('occlusion') || name.includes('tear')) {
                                            mat.visible = false; // Hide occlusion meshes
                                        }
                                        console.log('Applied fallback color to:', mat.name);
                                    }
                                    
                                    mat.needsUpdate = true;
                                    
                                    console.log('Material fixed:', mat.name || idx);
                                });
                            }
                            
                            // Collect meshes with morph targets
                            if (node.morphTargetInfluences && node.morphTargetDictionary) {
                                console.log('Found morph mesh:', node.name, Object.keys(node.morphTargetDictionary).join(','));
                                
                                // Initialize morph influences to 0
                                for (let i = 0; i < node.morphTargetInfluences.length; i++) {
                                    node.morphTargetInfluences[i] = 0;
                                }

                                ensureMorphBuffers(node);
                                
                                morphMeshes.push(node);
                            }
                        }
                    });

                    scene.add(avatar);
                    console.log('Avatar loaded with', morphMeshes.length, 'morph meshes');

                    // Position camera to show head and shoulders
                    fitCameraToAvatar();

                    // Hide loading
                    document.getElementById('loading').style.display = 'none';
                    
                    isReady = true;
                    console.log('Avatar ready');
                    setRestingLipPose(true);
                    setExpression('neutral', 1.0, { persist: true, immediate: true });

                    // Signal ready to Flutter
                    if (window.Flutter) {
                        window.Flutter.postMessage('ready');
                    }
                },
                function(progress) {
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        document.getElementById('loading').textContent = 'Loading: ' + percent + '%';
                    }
                },
                function(error) {
                    console.error('Error loading avatar:', error);
                    document.getElementById('loading').textContent = 'Error loading avatar';
                }
            );
        }

        // ============================================
        // CAMERA POSITIONING - MATCH DESKTOP
        // ============================================
        function fitCameraToAvatar() {
            if (!avatar) return;
            
            // Desktop uses fixed camera position
            camera.position.set(0, 50, 400);
            camera.lookAt(0, 0, 0);
            
            camera.near = 0.1;
            camera.far = 1000;
            camera.updateProjectionMatrix();

            console.log('Camera matched to desktop: (0, 50, 400)');
        }

        // ============================================
        // EXPRESSION CONTROL - THE CORE FIX
        // ============================================
        function setExpression(expressionName, intensity, options) {
            options = options || {};
            intensity = intensity !== undefined ? intensity : 1.0;
            console.log('=== setExpression:', expressionName, 'intensity:', intensity, '===');
            
            if (!isReady) {
                console.warn('Avatar not ready yet');
                return false;
            }

            if (morphMeshes.length === 0) {
                console.error('No morph meshes available!');
                return false;
            }

            const lowerExpr = expressionName.toLowerCase();
            const targetProfile = getExpressionProfile(lowerExpr, intensity);

            if (options.persist !== false) {
                restingExpressionName = lowerExpr;
            }

            console.log('Target profile for', expressionName + ':', JSON.stringify(targetProfile));

            let success = false;

            morphMeshes.forEach((mesh, meshIdx) => {
                const influences = mesh.morphTargetInfluences;
                const dictionary = mesh.morphTargetDictionary;

                if (!influences || !dictionary) {
                    console.warn('Mesh', mesh.name, 'missing morph data');
                    return;
                }

                ensureMorphBuffers(mesh);
                const lipIndices = getLipIndices(dictionary);
                resetExpressionTargets(mesh, lipIndices);

                Object.entries(targetProfile).forEach(([morphName, value]) => {
                    const idx = resolveMorphIndex(dictionary, morphName);
                        if (idx >= 0) {
                            mesh.userData.targetInfluences[idx] = Math.max(mesh.userData.targetInfluences[idx], value);
                            console.log('Applied', morphName, '=', value, 'on', mesh.name, 'idx=' + idx + ' mesh=' + meshIdx);
                            success = true;
                        }
                });

                if (options.immediate) {
                    mesh.userData.currentInfluences = Array.from(mesh.userData.targetInfluences);
                    mesh.userData.currentInfluences.forEach((value, index) => {
                        mesh.morphTargetInfluences[index] = value;
                    });
                    if (mesh.geometry) {
                        mesh.geometry.attributes.position.needsUpdate = true;
                        if (mesh.geometry.attributes.normal) {
                            mesh.geometry.attributes.normal.needsUpdate = true;
                        }
                    }
                }
            });

            // Force a render
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }

            console.log('Expression result:', success ? 'SUCCESS' : 'NO MATCH FOUND');
            return success;
        }

        function updateMorphTargets(deltaTime) {
            let needsRender = false;
            // Desktop original: expr_anim trans_dur=0.3, stat_dur=0.1.
            // Speed 8 gives ~95% convergence in 0.3s, matching Kitty's
            // Hermite smoothstep expression transition duration.
            const blendFactor = Math.min(1, deltaTime * (deviceProfile?.animationSpeed || 8));

            morphMeshes.forEach(mesh => {
                ensureMorphBuffers(mesh);
                const currentInfluences = mesh.userData.currentInfluences;
                const targetInfluences = mesh.userData.targetInfluences;

                // During active lip sync, skip lip morph indices — the lip
                // animator writes those directly via applyLipValues().
                let skipIndices = null;
                if (lipSyncActive) {
                    const dict = mesh.morphTargetDictionary;
                    if (dict) {
                        skipIndices = getLipIndices(dict);
                    }
                }

                for (let i = 0; i < targetInfluences.length; i++) {
                    if (skipIndices && skipIndices.has(i)) continue;

                    const current = currentInfluences[i] || 0;
                    const target = targetInfluences[i] || 0;
                    const next = Math.abs(target - current) < 0.002
                        ? target
                        : current + (target - current) * blendFactor;

                    if (Math.abs(next - current) > 0.0005) {
                        currentInfluences[i] = next;
                        mesh.morphTargetInfluences[i] = next;
                        needsRender = true;
                    }
                }

                if (needsRender && mesh.geometry) {
                    mesh.geometry.attributes.position.needsUpdate = true;
                    if (mesh.geometry.attributes.normal) {
                        mesh.geometry.attributes.normal.needsUpdate = true;
                    }
                }
            });

            return needsRender;
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate(timestamp) {
            requestAnimationFrame(animate);
            // During speech, aggressively throttle rendering to 18 FPS to reduce CPU
            // contention with the Web Audio / MediaPlayer thread. Audio buffer underruns
            // from GPU/render competition are the primary cause of crackling on Android emulators.
            const speakingMode = isSpeaking || lipSyncActive;
            const targetFPS = speakingMode ? 18 : (deviceProfile?.targetFPS || 60);
            const frameInterval = 1000 / targetFPS;
            if (timestamp && timestamp - lastRenderTimestamp < frameInterval) {
                return;
            }
            lastRenderTimestamp = timestamp || performance.now();

            const deltaTime = Math.min(clock.getDelta(), 0.05);
            updateMorphTargets(deltaTime);
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // ============================================
        // RESIZE HANDLER
        // ============================================
        function onResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // ============================================
        // LIP SYNC
        // ============================================
        let lipSyncActive = false;
        let lipSyncPhones = [];
        let lipSyncDuration = 0;
        let lipSyncStartTime = 0;
        let lipSyncFrameId = null;
        let lipSyncCurrentIndex = -1;
        let lipSyncProgressHint = 0;
        let lipSyncRateScale = 1.0;
        let lastLipAnimTime = 0;
        let lipSyncAudioElement = null;  // HTML5 Audio element for precise timing

        function syncLipProgress(progress) {
            if (!lipSyncActive || lipSyncDuration <= 0) {
                return false;
            }

            const elapsed = (Date.now() - lipSyncStartTime) / 1000;
            const scaledElapsed = elapsed * lipSyncRateScale;
            const estimatedProgress = scaledElapsed / lipSyncDuration;
            const actualProgress = clamp01(progress);

            // If TTS is still speaking but our duration estimate has been
            // reached, extend the lip-sync duration so lips keep moving.
            if (actualProgress < 0.92 && estimatedProgress > 0.90) {
                const newDuration = elapsed / Math.max(actualProgress, 0.05);
                lipSyncDuration = Math.max(lipSyncDuration, newDuration);
                lipAnimator.transDur = Math.max(lipSyncDuration / Math.max(lipSyncPhones.length, 1), 0.08);
            }

            // Adjust playback rate so lip-sync converges with actual TTS position.
            // This corrects both too-fast and too-slow animation.
            if (estimatedProgress > 0.02 && actualProgress > 0.01) {
                const ratio = actualProgress / estimatedProgress;
                lipSyncRateScale = lipSyncRateScale * 0.6 + (lipSyncRateScale * ratio) * 0.4;
                lipSyncRateScale = Math.max(0.3, Math.min(2.5, lipSyncRateScale));
            }

            lipSyncProgressHint = actualProgress;
            return true;
        }

        function getPhonemes(text, providedPhonemes) {
            if (Array.isArray(providedPhonemes) && providedPhonemes.length > 0) {
                return providedPhonemes
                    .map(phone => {
                        const normalized = String(phone || '').trim().toUpperCase();
                        return DESKTOP_ARPABET_MAPPING[normalized] || null;
                    })
                    .filter(Boolean);
            }

            text = text.toLowerCase();
            const phonemes = [];
            const words = text.split(/\s+/);

            // Common English multi-letter patterns → lip shapes
            const ENGLISH_PATTERNS = {
                'tion': ['ch_j_sh', 'eh', 'n'],
                'sion': ['ch_j_sh', 'eh', 'n'],
                'ough': ['oh', 'f_v'],
                'ight': ['small_aah', 'd_s_t'],
                'ould': ['ooh_q', 'n', 'd_s_t'],
                'ious': ['ee', 'eh', 'd_s_t'],
                'ness': ['n', 'eh', 'd_s_t'],
                'ment': ['b_m_p', 'eh', 'n', 'd_s_t'],
                'ing': ['i', 'n'],
                'tch': ['ch_j_sh'],
                'dge': ['ch_j_sh'],
                'ght': ['d_s_t'],
                'ck': ['k'],
                'qu': ['k', 'w'],
            };

            for (let wordIdx = 0; wordIdx < words.length; wordIdx++) {
                const word = words[wordIdx].replace(/[.,!?;:'"()\[\]{}]/g, '');
                if (!word) continue;

                let i = 0;
                while (i < word.length) {
                    let matched = false;

                    // Try 4-char, 3-char English patterns first
                    for (const len of [4, 3, 2]) {
                        if (i + len <= word.length) {
                            const substr = word.substring(i, i + len);
                            if (ENGLISH_PATTERNS[substr]) {
                                ENGLISH_PATTERNS[substr].forEach(p => phonemes.push(p));
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                    }
                    if (matched) continue;

                    const char = word[i];
                    const twoChar = i + 2 <= word.length ? word.substring(i, i + 2) : '';
                    const isVowel = 'aeiou'.includes(char);

                    // Try two-char mapping (digraphs: th, sh, ch, ee, oo, etc.)
                    if (twoChar && DESKTOP_TEXT_MAPPING[twoChar]) {
                        phonemes.push(DESKTOP_TEXT_MAPPING[twoChar]);
                        // Double vowels get held longer for natural feel
                        if (isVowel) phonemes.push(DESKTOP_TEXT_MAPPING[twoChar]);
                        i += 2;
                        continue;
                    }

                    // Single character mapping
                    const shape = DESKTOP_TEXT_MAPPING[char] || PHONEME_MAPPING[char];
                    if (shape) {
                        phonemes.push(shape);
                        // Vowels are the core of syllables — hold them longer
                        if (isVowel) phonemes.push(shape);
                        i += 1;
                    } else {
                        i += 1;
                    }
                }
                // Word boundary: brief mouth closure between words
                if (wordIdx < words.length - 1) {
                    phonemes.push('b_m_p');
                }
            }
            return phonemes;
        }

        function clamp01(value) {
            return Math.max(0, Math.min(1, value));
        }

        // ==========================================================
        // LIP ANIMATOR — Direct port of Kitty's Animator state machine
        // ==========================================================
        // Original desktop (Animator.py):
        //   - Hermite smoothstep:  t = 6*t^5 - 15*t^4 + 10*t^3
        //   - State machine:       'trans' -> 'stat' -> 'trans'
        //   - trans_dur:           audio_duration / num_phonemes
        //   - stat_dur:            0.001 (essentially instant hold)
        //   - One lip shape active at a time
        //   - Per-vertex variance-weighted blending separates expression/lip
        //
        // On mobile we can't do per-vertex blending, so we use moderate
        // lip intensity (~0.55) and directly write lip morph values,
        // bypassing the slower global updateMorphTargets blend.
        const BASE_LIP_INTENSITY = 0.85; // Increased for more expressive lip sync

        const lipAnimator = {
            state: 'idle',     // 'idle' | 'trans' | 'stat'
            cycleTime: 0,
            transDur: 0.1,     // set per-session to duration / numPhones
            statDur: 0.001,    // matches original
            curr: {},          // current lip shape values (all 16 shapes)
            target: {},        // target lip shape values

            reset() {
                this.state = 'idle';
                this.cycleTime = 0;
                LIP_SHAPES.forEach(s => {
                    this.curr[s] = 0;
                    this.target[s] = 0;
                });
            },

            // Hermite smoothstep — identical to Animator.interp_face()
            //   t_smooth = 6t^5 - 15t^4 + 10t^3
            // Zero derivative at t=0 and t=1 → smooth accel/decel
            hermite(t) {
                t = Math.max(0, Math.min(1, t));
                const t3 = t * t * t;
                const t4 = t3 * t;
                const t5 = t4 * t;
                return 6 * t5 - 15 * t4 + 10 * t3;
            },

            // Called when phoneme index changes (like Combiner calling
            // lip_anim.set_target when TextManager says "changed")
            setPhonemeTarget(shapeName) {
                // Snapshot current interpolated position
                LIP_SHAPES.forEach(s => {
                    this.curr[s] = this.getInterpolatedValue(s);
                });
                // New target: zero all, then blend a small viseme profile.
                // Real speech usually shows a main mouth pose plus a little
                // co-articulation from nearby lip/jaw shapes.
                LIP_SHAPES.forEach(s => { this.target[s] = 0; });
                const profile = shapeName ? (LIP_SHAPE_PROFILE[shapeName] || { [shapeName]: 1.0 }) : null;
                if (profile) {
                    Object.entries(profile).forEach(([shape, weight]) => {
                        if (LIP_SHAPE_STRENGTH[shape] !== undefined) {
