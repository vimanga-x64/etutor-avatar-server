                            this.target[shape] = BASE_LIP_INTENSITY * LIP_SHAPE_STRENGTH[shape] * weight;
                        }
                    });
                }
                
                this.actualTransDur = this.transDur;
                if (shapeName && OPEN_LIP_SHAPES.has(shapeName)) {
                    this.actualTransDur = Math.max(Math.min(this.transDur * 1.12, 0.09), 0.055);
                } else if (shapeName && CLOSED_LIP_SHAPES.has(shapeName)) {
                    this.actualTransDur = Math.max(Math.min(this.transDur * 0.85, 0.065), 0.035);
                }                
                this.state = 'trans';
                this.cycleTime = 0;
            },

            getInterpolatedValue(shapeName) {
                const dur = this.actualTransDur || this.transDur;
                if (this.state !== 'trans' || dur <= 0) {
                    return this.curr[shapeName] || 0;
                }
                const t = this.hermite(this.cycleTime / dur);
                const c = this.curr[shapeName] || 0;
                const tgt = this.target[shapeName] || 0;
                return (1 - t) * c + t * tgt;
            },

            // Called every frame with delta-time — mirrors Animator.get_verts(dt)
            getValues(dt) {
                if (this.state === 'idle') return this.curr;

                this.cycleTime += dt;
                const dur = this.actualTransDur || this.transDur;

                if (this.state === 'trans') {
                    if (this.cycleTime >= dur) {
                        // Transition complete — snap to target
                        LIP_SHAPES.forEach(s => {
                            this.curr[s] = this.target[s];
                        });
                        this.state = 'stat';
                        this.cycleTime = 0;
                        return this.curr;
                    }
                    // Hermite interpolation between curr and target
                    const t = this.hermite(this.cycleTime / dur);
                    const result = {};
                    LIP_SHAPES.forEach(s => {
                        const c = this.curr[s] || 0;
                        const tgt = this.target[s] || 0;
                        result[s] = (1 - t) * c + t * tgt;
                    });
                    return result;
                }

                if (this.state === 'stat') {
                    // Hold complete after stat_dur — stay until next
                    // setPhonemeTarget() call
                    return this.curr;
                }

                return this.curr;
            }
        };

        // Write lip animator values directly to morphTargetInfluences,
        // bypassing the global updateMorphTargets blend (which is too slow
        // for phoneme-rate changes).
        function applyLipValues(lipValues) {
            if (!isReady || morphMeshes.length === 0) return;
            morphMeshes.forEach(mesh => {
                const dictionary = mesh.morphTargetDictionary;
                if (!dictionary) return;
                ensureMorphBuffers(mesh);
                LIP_SHAPES.forEach(shape => {
                    const idx = resolveMorphIndex(dictionary, shape);
                    if (idx >= 0) {
                        const val = lipValues[shape] || 0;
                        mesh.morphTargetInfluences[idx] = val;
                        mesh.userData.currentInfluences[idx] = val;
                        mesh.userData.targetInfluences[idx] = val;
                    }
                });
                // Keep lip_close at zero during speech
                const lipCloseIdx = resolveMorphIndex(dictionary, 'lip_close');
                if (lipCloseIdx >= 0) {
                    mesh.morphTargetInfluences[lipCloseIdx] = 0;
                    mesh.userData.currentInfluences[lipCloseIdx] = 0;
                    mesh.userData.targetInfluences[lipCloseIdx] = 0;
                }
            });
        }

        function phoneIntensity(shapeName) {
            return BASE_LIP_INTENSITY;
        }

        function startLipSync(text, duration, providedPhonemes, audioElement) {
            lipSyncPhones = getPhonemes(text, providedPhonemes);
            if (!lipSyncPhones.length) {
                lipSyncPhones = ['b_m_p', 'small_aah', 'oh', 'b_m_p'];
            }
            const desktopDurationFloor = (String(text || '').trim().length / 15) / 0.85;
            lipSyncDuration = Math.max(duration || 0, desktopDurationFloor, lipSyncPhones.length * 0.06, 0.5);
            lipSyncStartTime = Date.now();
            lipSyncCurrentIndex = -1;
            lipSyncProgressHint = 0;
            lipSyncRateScale = 1.0;
            lastLipAnimTime = Date.now();
            // Store audio element reference for precise timing sync
            lipSyncAudioElement = audioElement || null;

            lipAnimator.reset();
            // Desktop original: trans_dur = audio_duration / num_phonemes.
            // Floor of 0.08s prevents lip transitions faster than human lips
            // can physically move (~80-100ms minimum articulation time).
            lipAnimator.transDur = Math.max(lipSyncDuration / Math.max(lipSyncPhones.length, 1), 0.08);
            lipAnimator.statDur = 0.001;

            lipSyncActive = true;
            if (lipSyncFrameId) cancelAnimationFrame(lipSyncFrameId);
            animateLipSync();
        }

        function animateLipSync() {
            if (!lipSyncActive) return;

            const now = Date.now();
            const dt = Math.min((now - lastLipAnimTime) / 1000, 0.05);
            lastLipAnimTime = now;

            // Use audio element's currentTime for precise sync when available,
            // otherwise fall back to wall-clock estimation.
            let elapsed;
            if (lipSyncAudioElement && !isNaN(lipSyncAudioElement.currentTime) && lipSyncAudioElement.currentTime > 0) {
                elapsed = lipSyncAudioElement.currentTime;
                // Also update duration if audio element has a more accurate value
                if (!isNaN(lipSyncAudioElement.duration) && lipSyncAudioElement.duration > 0.5) {
                    lipSyncDuration = lipSyncAudioElement.duration;
                }
            } else {
                elapsed = (now - lipSyncStartTime) / 1000 * lipSyncRateScale;
            }

            if (elapsed < lipSyncDuration) {
                const phoneIndex = Math.min(
                    Math.floor(lipSyncPhones.length * (elapsed / lipSyncDuration)),
                    lipSyncPhones.length - 1
                );

                if (phoneIndex !== lipSyncCurrentIndex && phoneIndex >= 0) {
                    lipSyncCurrentIndex = phoneIndex;
                    lipAnimator.setPhonemeTarget(lipSyncPhones[phoneIndex]);
                }
            } else {
                // Past estimated duration — smoothly close mouth and stop.
                lipAnimator.setPhonemeTarget(null);
                const lipValues = lipAnimator.getValues(dt);
                applyLipValues(lipValues);
                // Check if mouth has closed enough to stop
                let maxVal = 0;
                LIP_SHAPES.forEach(s => { maxVal = Math.max(maxVal, Math.abs(lipValues[s] || 0)); });
                if (maxVal < 0.01) {
                    stopLipSync();
                }
                lipSyncFrameId = requestAnimationFrame(animateLipSync);
                return;
            }

            const lipValues = lipAnimator.getValues(dt);
            applyLipValues(lipValues);

            lipSyncFrameId = requestAnimationFrame(animateLipSync);
        }

        function stopLipSync() {
            lipSyncActive = false;
            lipSyncCurrentIndex = -1;
            lipSyncProgressHint = 0;
            lipSyncRateScale = 1.0;
            lipSyncAudioElement = null;
            _pollyExternalElapsedMs = 0;
            _pollyExternalElapsedAt = 0;
            if (lipSyncFrameId) {
                cancelAnimationFrame(lipSyncFrameId);
                lipSyncFrameId = null;
            }
            lipAnimator.reset();
            resetAllLipTargets();
        }

        function resetAllLipTargets() {
            morphMeshes.forEach(mesh => {
                const dictionary = mesh.morphTargetDictionary;
                if (!dictionary) return;
                ensureMorphBuffers(mesh);
                LIP_SHAPES.forEach(shape => {
                    const idx = resolveMorphIndex(dictionary, shape);
                    if (idx >= 0) {
                        mesh.userData.targetInfluences[idx] = 0;
                        mesh.userData.currentInfluences[idx] = 0;
                        mesh.morphTargetInfluences[idx] = 0;
                    }
                });
                const lipCloseIdx = resolveMorphIndex(dictionary, 'lip_close');
                if (lipCloseIdx >= 0) {
                    mesh.userData.targetInfluences[lipCloseIdx] = 0;
                    mesh.userData.currentInfluences[lipCloseIdx] = 0;
                    mesh.morphTargetInfluences[lipCloseIdx] = 0;
                }
            });
        }
        // FLUTTER INTERFACE
        // ============================================
        window.changeExpression = function(expression) {
            console.log('Flutter called changeExpression:', expression);
            return setExpression(expression, 1.0);
        };

        window.setExpressionIntensity = function(expression, intensity) {
            console.log('Flutter called setExpressionIntensity:', expression, intensity);
            return setExpression(expression, intensity);
        };

        window.speakText = function(text) {
            const request = parseSpeechRequest(text, arguments.length > 1 ? arguments[1] : null);
            void speakRequest(0, request);
            return true;
        };

        window.speakTextFromFlutter = function(requestId, text, expression, phonemes) {
            const request = parseSpeechRequest(text, {
                emotion: expression,
                phonemes: Array.isArray(phonemes) ? phonemes : null
            });
            void speakRequest(Number(requestId) || 0, request);
            return true;
        };

        window.stopSpeaking = function() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            clearCloudAudio();
            currentUtterance = null;
            isSpeaking = false;
            stopLipSync();
            setExpression(restingExpressionName, 1.0, { persist: false });
            return true;
        };

        window.stopLipSyncFromFlutter = function() {
            stopLipSync();
            setExpression(restingExpressionName, 1.0, { persist: false });
            return true;
        };

        window.startLipSyncFromFlutter = function(text, expression, duration, phonemes, intensity) {
            const speechText = typeof text === 'string' ? text : '';
            const targetExpression = EXPRESSIONS[expression] ? expression : 'neutral';
            const speechDuration = Math.max(Number(duration) || 0, 0.8);
            const providedPhonemes = Array.isArray(phonemes) ? phonemes : null;
            // During lip sync, use moderate expression intensity so expressions
            // don't fight with lip morph targets (the original desktop uses per-vertex
            // variance-weighted blending to separate expression/lip channels).
            const rawIntensity = (typeof intensity === 'number' && intensity > 0) ? intensity : 1.0;
            const exprIntensity = expressionIntensityForSpeech(targetExpression, rawIntensity);

            setExpression(targetExpression, exprIntensity, { persist: false, immediate: true });
            startLipSync(speechText, speechDuration, providedPhonemes);
            return true;
        };

        window.startPollyLipSyncFromFlutter = function(visemesJson, expression, intensity) {
            let visemes = [];
            try { visemes = JSON.parse(visemesJson); } catch (e) {}
            
            const targetExpression = EXPRESSIONS[expression] ? expression : 'neutral';
            const rawIntensity = (typeof intensity === 'number' && intensity > 0) ? intensity : 1.0;
            const exprIntensity = expressionIntensityForSpeech(targetExpression, rawIntensity);

            setExpression(targetExpression, exprIntensity, { persist: false, immediate: true });
            _startPollyLipSync(visemes);
            return true;
        };

        window.startAzureLipSyncFromFlutter = window.startPollyLipSyncFromFlutter;
        window.startCloudLipSyncFromFlutter = window.startPollyLipSyncFromFlutter;

        window.syncPollyLipProgressFromFlutter = function(elapsedMs) {
            const elapsed = Number(elapsedMs);
            if (!Number.isFinite(elapsed) || elapsed < 0) return false;
            _pollyExternalElapsedMs = elapsed;
            _pollyExternalElapsedAt = performance.now();
            return true;
        };

        window.syncCloudLipProgressFromFlutter = window.syncPollyLipProgressFromFlutter;

        window.syncLipProgressFromFlutter = function(progress, start, end, word) {
            syncLipProgress(Number(progress) || 0);
            return true;
        };

        window.finishSpeechFromFlutter = function() {
            stopLipSync();
            setTimeout(function() {
                setExpression(restingExpressionName, 1.0, { persist: false });
            }, 220);
            return true;
        };

        function inferEmotionFromText(text, options) {
            const modeId = normalizeModeId(options && options.modeId);
            if (modeId !== null) {
                const sentimentSignal = computeSentimentSignal(options, text);
                const fuzzyEmotion = inferEmotionFromDesktopMode(modeId, sentimentSignal);
                if (fuzzyEmotion) {
                    return fuzzyEmotion;
                }
            }

            const normalized = text.toLowerCase();
            if (normalized.includes('great') || normalized.includes('excellent') || normalized.includes('awesome') || normalized.includes('👏')) {
                return 'smile';
            }
            if (normalized.includes('sorry') || normalized.includes('try again') || normalized.includes('incorrect')) {
                return 'sad';
            }
            if (normalized.includes('careful') || normalized.includes('warning') || normalized.includes('mistake')) {
                return 'frown';
            }
            if (normalized.includes('wow') || normalized.includes('amazing') || normalized.includes('surprise')) {
                return 'surprise';
            }
            return 'neutral';
        }

        window.welcomeStudent = function(name) {
            console.log('Flutter called welcomeStudent:', name);
            setExpression('smile', 1.0);
            return true;
        };

        window.isAvatarReady = function() {
            return isReady && morphMeshes.length > 0;
        };

        window.getMorphNames = function() {
            if (morphMeshes.length > 0 && morphMeshes[0].morphTargetDictionary) {
                return Object.keys(morphMeshes[0].morphTargetDictionary);
            }
            return [];
        };

        window.AvatarAPI = {
            setExpression: setExpression,
            setExpressionImmediate: function(expression) { return setExpression(expression, 1.0); },
            speakText: window.speakText,
            stopSpeaking: window.stopSpeaking,
            getPerformanceProfile: function() { return deviceProfile; },
            getSpeechProfile: getSpeechProfile,
            inferEmotionFromDesktopMode: inferEmotionFromDesktopMode,
            isReady: function() { return isReady && morphMeshes.length > 0; },
            getMorphNames: function() {
                if (morphMeshes.length > 0 && morphMeshes[0].morphTargetDictionary) {
                    return Object.keys(morphMeshes[0].morphTargetDictionary);
                }
                return [];
            }
        };

        // ============================================
        // START
        // ============================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
